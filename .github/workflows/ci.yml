name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build (sem testes)
        working-directory: backend
        run: mvn -B -ntp clean compile

      - name: Rodar testes (unitários + integração com Testcontainers)
        working-directory: backend
        run: mvn -B -ntp test

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Empacotar jar
        working-directory: backend
        run: mvn -B -ntp package -DskipTests

      - name: Publicar jar
        uses: actions/upload-artifact@v4
        with:
          name: finance-app-jar
          path: backend/target/*.jar
          retention-days: 7
