version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: finance-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-financeapp}
      POSTGRES_USER: ${DB_USER:-financeapp}
      POSTGRES_PASSWORD: ${DB_PASS:-financeapp}
    ports:
      - "5432:5432"
    volumes:
      - finance_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-financeapp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-app-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-financeapp}
      DB_USER: ${DB_USER:-financeapp}
      DB_PASS: ${DB_PASS:-financeapp}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-env-minimum-32-chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  finance_app_pgdata:
